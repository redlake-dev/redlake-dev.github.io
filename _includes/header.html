<header class="bg-white shadow-sm sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex items-center space-x-3">
                <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Redlake Logo" class="h-12 w-12">
                <span class="text-2xl font-bold text-brand-charcoal">redlake</span>
            </div>
            
            <div class="hidden md:flex items-center space-x-8">
                <a href="#services" class="text-gray-700 hover:text-brand-teal transition duration-200 font-medium">Services</a>
                <a href="#contact" class="text-gray-700 hover:text-brand-teal transition duration-200 font-medium">Contact</a>
                <a href="#contact" class="btn-primary">Get Started</a>
            </div>
            
            <!-- Mobile menu button -->
            <div class="md:hidden">
                <button type="button" class="text-gray-700 hover:text-brand-teal" onclick="toggleMobileMenu()">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden pb-4">
            <div class="flex flex-col space-y-3">
                <a href="#services" class="text-gray-700 hover:text-brand-teal transition duration-200 font-medium">Services</a>
                <a href="#contact" class="text-gray-700 hover:text-brand-teal transition duration-200 font-medium">Contact</a>
                <a href="#contact" class="btn-primary inline-block text-center">Get Started</a>
            </div>
        </div>
    </nav>
</header>

<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
}
</script>
