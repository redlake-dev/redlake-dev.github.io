<section id="services" class="py-20 md:py-32 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-16">
            <h2 class="section-heading">Our Services</h2>
            <p class="section-subheading">We specialize in building software that drives your business forward</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            {% for service in site.data.services %}
            <div class="bg-brand-cream rounded-xl p-8 hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                <div class="w-16 h-16 bg-brand-teal rounded-lg flex items-center justify-center mb-6">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ service.icon }}"></path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-brand-charcoal mb-4">{{ service.title }}</h3>
                <p class="text-gray-600 mb-6 leading-relaxed">{{ service.description }}</p>
                <ul class="space-y-2">
                    {% for feature in service.features %}
                    <li class="flex items-start">
                        <svg class="w-5 h-5 text-brand-orange mr-2 mt-1 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                        </svg>
                        <span class="text-gray-700">{{ feature }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
